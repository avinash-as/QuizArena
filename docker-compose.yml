version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: QuizPitara-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: QuizPitara

  redis:
    image: redis:7-alpine
    container_name: QuizPitara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    container_name: QuizPitara-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/QuizPitara
      REDIS_URL: redis://redis:6379
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build: ./frontend
    container_name: QuizPitara-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
